services:
  mail-aggregator:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./data:/app/data"]
    environment:
      APP_ENV: production
      APP_DATA_DIR: /app/data
      APP_LISTEN_ADDR: ":8080"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      LOG_LEVEL: info
      SESSION_IDLE_TIMEOUT: 30m
      SESSION_MAX_LIFETIME: 12h
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXIES: ""
      ALLOWED_MAIL_PORTS: "143,465,587,993"
      ALLOW_PRIVATE_MAIL_SERVERS: "false"
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP:-}
      REGISTRATION_DISABLED: ${REGISTRATION_DISABLED:-false}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ulimits:
      core: {soft: 0, hard: 0}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    memswap_limit: ${APP_MEMORY_LIMIT:-512m}
