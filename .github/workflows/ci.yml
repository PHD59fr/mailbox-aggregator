name: CI
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC: rebuild with current base-image patches.
permissions: { contents: read }
env:
  IMAGE_NAME: phd59fr/mailbox-aggregator
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code
      - run: go fmt ./... && git diff --exit-code
      - run: go vet ./...
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -count=1 ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: CGO_ENABLED=0 go build -o mailbox-aggregator ./cmd/server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint && npm run typecheck && npm run test && npm run build
        working-directory: web
      - name: Verify reproducible assets and chunk budgets
        run: npm run test:build
        working-directory: web
      - name: Verify encrypted drafts and Argon2 Worker in Chromium
        run: npm run test:browser
        working-directory: web
        env:
          CHROME_BIN: google-chrome
  container:
    name: Docker
    runs-on: ubuntu-latest
    needs: [build, web, opaque-interop]
    env:
      PUBLISH_IMAGE: ${{ github.repository == 'PHD59fr/mailbox-aggregator' && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      - name: Check Docker Hub credentials
        if: env.PUBLISH_IMAGE == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Set DOCKER_USERNAME and DOCKER_PASSWORD repository secrets. Use a Docker Hub access token with write permission for DOCKER_PASSWORD."
            exit 1
          fi
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mailbox-aggregator
          cache-to: type=gha,mode=max,scope=mailbox-aggregator
  opaque-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Start temporary OPAQUE-enabled server
        run: |
          export OPAQUE_SERVER_SETUP=""
          export APP_DATA_DIR="$RUNNER_TEMP/postbox-interop-data"
          go run ./cmd/server > "$RUNNER_TEMP/postbox-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/postbox-server.pid"
          for ((attempt=0; attempt<60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postbox-server.log"
          exit 1
      - name: Verify browser/Go OPAQUE interoperability and self-deletion
        run: npm run test:interop
        working-directory: web
      - name: Verify password rotation and isolated backup restoration
        run: |
          go build -o "$RUNNER_TEMP/postbox-lifecycle" ./cmd/server
          TEST_SERVER_BINARY="$RUNNER_TEMP/postbox-lifecycle" node tests/account-lifecycle.mjs
